version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: owc-fantasy-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql://rustuser:password@172.17.0.1/owc_fantasy
      SESSION_SECRET: ${SESSION_SECRET:-your-super-secret-session-key-here-make-it-long-and-random}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_URL: https://osu.ppy.sh/oauth/authorize
      OAUTH_TOKEN_URL: https://osu.ppy.sh/oauth/token
      REDIRECT_URL: ${REDIRECT_URL:-http://localhost:8080/api/auth/callback}
      ADMIN_CLIENT_ID: ${ADMIN_CLIENT_ID}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./backend/.env:/app/.env:ro
