version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: owc-fantasy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: owc_fantasy
      MYSQL_USER: rustuser
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./setup.sql:/docker-entrypoint-initdb.d/02-setup.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: owc-fantasy-rs-backend:latest
    container_name: owc-fantasy-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql://rustuser:password@db/owc_fantasy
      SESSION_SECRET: ${SESSION_SECRET:-wysiwysiwysiwysiwysiwysiwysiwysiwysiwysiwysiwysiwysiwysiwysiwys1}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-https://owcfantasy.xyz}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://owcfantasy.xyz,https://api.owcfantasy.xyz}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_URL: https://osu.ppy.sh/oauth/authorize
      OAUTH_TOKEN_URL: https://osu.ppy.sh/oauth/token
      REDIRECT_URL: ${REDIRECT_URL:-http://api.owcfantasy.xyz/api/auth/callback}
      ADMIN_CLIENT_ID: ${ADMIN_CLIENT_ID}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/.env:/app/.env:ro

  frontend:
    image: owc-fantasy-rs-frontend:latest
    container_name: owc-fantasy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
